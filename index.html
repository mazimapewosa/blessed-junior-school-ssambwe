async function currentAcademicTerm(){
  // Use the database current flag first, then the school setting, then the newest year.
  // This keeps billing/fee-structure screens working even if a current flag was not set.
  const configuredYear=Number(settings?.current_academic_year||0);
  const ay=years.find(y=>y.is_current) || years.find(y=>Number(y.year)===configuredYear) || years[0];
  if(!ay)return {ay:null,term:null};
  const now=today();
  const yearTerms=terms.filter(t=>t.academic_year_id===ay.id);
  const configuredTerm=String(settings?.current_term||'').trim().toLowerCase();
  const term=yearTerms.find(t=>configuredTerm && String(t.name||'').trim().toLowerCase()===configuredTerm)
    || yearTerms.find(t=>(!t.start_date||t.start_date<=now)&&(!t.end_date||t.end_date>=now))
    || yearTerms[0] || terms.find(t=>(!t.start_date||t.start_date<=now)&&(!t.end_date||t.end_date>=now));
  return {ay,term};
}
async function getTuitionFeeId(){return fees.find(f=>String(f.name).trim().toLowerCase()==='tuition fees')?.id||null}
async function tuitionAmountForStudent(studentId,yearId,termId){
  const s=students.find(x=>x.id===studentId); const en=enrollments.find(e=>e.student_id===studentId&&e.status==='active');
  if(!s||!en||!yearId||!termId)return 0;
  const r=await db.from('fee_structures').select('day_fee,boarding_fee').eq('class_id',en.class_id).eq('academic_year_id',yearId).eq('term_id',termId).maybeSingle();
  if(r.error||!r.data)return 0;
  return String(s.student_type||'Day')==='Boarding'?Number(r.data.boarding_fee||0):Number(r.data.day_fee||0);
}

async function autoInvoiceAllTuition(){
  const {ay,term}=await currentAcademicTerm(); const tuitionId=await getTuitionFeeId();
  if(!ay||!term||!tuitionId)return alert('Current academic year/term or Tuition Fees item is missing.');
  const st=students.filter(s=>s.status==='active'); let created=0,skipped=0;
  for(const s of st){
    const en=enrollments.find(e=>e.student_id===s.id&&e.academic_year_id===ay.id&&e.status==='active'); if(!en){skipped++;continue;}
    const amount=await tuitionAmountForStudent(s.id,ay.id,term.id); if(amount<=0){skipped++;continue;}
    const existing=await db.from('fee_invoices').select('id').eq('student_enrollment_id',en.id).eq('academic_year_id',ay.id).eq('term_id',term.id).neq('status','cancelled');
    const ids=existing.data||[]; let already=false;
    if(ids.length){const li=await db.from('fee_invoice_items').select('invoice_id').eq('fee_item_id',tuitionId).in('invoice_id',ids.map(x=>x.id));already=(li.data||[]).length>0;}
    if(already){skipped++;continue;}
    let inv=await db.from('fee_invoices').insert({student_enrollment_id:en.id,academic_year_id:ay.id,term_id:term.id,invoice_date:today(),status:'draft',notes:'Automatic current-term tuition fee'}).select().single();
    if(inv.error)return alert(errMsg(inv.error));
    let li=await db.from('fee_invoice_items').insert({invoice_id:inv.data.id,fee_item_id:tuitionId,amount,description:`${s.student_type||'Day'} tuition - ${classes.find(c=>c.id===en.class_id)?.name||''}`});
    if(li.error){await db.from('fee_invoices').delete().eq('id',inv.data.id);return alert(errMsg(li.error));}
    const up=await db.from('fee_invoices').update({status:'issued'}).eq('id',inv.data.id); if(up.error)return alert(errMsg(up.error)); created++;
  }
  alert(`Tuition invoicing complete: ${created} invoice(s) created, ${skipped} skipped.`); billingPage();
}

function updateProfileSalaryAmount(){
  const staffEl=document.getElementById('profileSalaryStaff'), amountEl=document.getElementById('profileSalaryAmount'), descEl=document.getElementById('profileSalaryDescription');

async function saveSalaryFromProfile(defaultStaffId){
  const staffEl=document.getElementById('profileSalaryStaff'),dateEl=document.getElementById('profileSalaryDate'),amountEl=document.getElementById('profileSalaryAmount'),methodEl=document.getElementById('profileSalaryMethod'),refEl=document.getElementById('profileSalaryReference'),msgEl=document.getElementById('profileSalaryMsg');
  const staffId=staffEl?.value||defaultStaffId, s=staffRows.find(x=>x.id===staffId), amount=Number(amountEl?.value||0);
  if(!s)return msgEl.innerHTML='<div class="notice err">Please select a staff member.</div>';
  if(amount<=0)return msgEl.innerHTML='<div class="notice err">Salary amount must be greater than zero.</div>';
  if(!dateEl?.value)return msgEl.innerHTML='<div class="notice err">Payment date is required.</div>';
  const r=await db.from('salary_payments').insert({staff_id:s.id,payment_date:dateEl.value,amount,payment_method:methodEl.value,reference_no:refEl.value||null,authorized_by:currentUser.id}).select().single();
  if(r.error)return msgEl.innerHTML=`<div class="notice err">${esc(errMsg(r.error))}</div>`;
  const ref=r.data.voucher_no||'SAL-'+r.data.id.slice(0,8).toUpperCase();
  const smsMessage=`Dear ${s.full_name}, salary payment of ${money(amount)} has been recorded on ${dateEl.value}. Voucher: ${ref}.`;
  await db.from('notification_messages').insert({recipient_type:'staff',recipient_name:s.full_name,recipient_phone:s.phone,staff_id:s.id,notification_type:'salary_payment',subject:'Salary payment',message:smsMessage,related_salary_payment_id:r.data.id});
  const sms=await sendSchoolSMS(s.phone,smsMessage);
  dataCacheAt=0;dashboardCache=null;
  alert(sms.ok?`Salary payment saved. Voucher ${ref}. SMS sent.`:`Salary payment saved. Voucher ${ref}. SMS queued; ${sms.message||'SMS service needs configuration.'}`);
  await loadData(true); staffProfile(s.id);
}
async function editSalaryPayment(id){
  const r=await db.from('salary_payments').select('*').eq('id',id).single();
  if(r.error)return alert(errMsg(r.error)); const x=r.data;
  if(x.is_reversed)return alert('This salary payment is already voided/reversed.');
  const date=prompt('Payment date (YYYY-MM-DD):',x.payment_date); if(!date)return;
  const amount=prompt('Amount (UGX):',x.amount); if(!amount||+amount<=0)return;
  const method=prompt('Payment method:',x.payment_method||'Cash'); if(method===null)return;
  const ref=prompt('Reference No. (optional):',x.reference_no||''); if(ref===null)return;
  const u=await db.rpc('edit_salary_payment',{p_id:id,p_payment_date:date,p_amount:+amount,p_payment_method:method,p_reference_no:ref});
  if(u.error)return alert(errMsg(u.error));
  dataCacheAt=0;dashboardCache=null;alert('Salary payment corrected and the Cash Book was synchronized.');staffProfile(x.staff_id);
}
async function deleteSalaryPayment(id){
  const r=await db.from('salary_payments').select('id,staff_id,voucher_no,is_reversed').eq('id',id).single();
  if(r.error)return alert(errMsg(r.error)); if(r.data.is_reversed)return alert('This salary payment is already voided.');
  const reason=prompt('Reason for deleting/voiding this salary payment:'); if(!reason)return;
  if(!confirm('Void this salary payment? The audit trail will be preserved and the Cash Book entry will also be reversed.'))return;
  const u=await db.rpc('reverse_financial_transaction',{p_table:'salary_payments',p_id:id,p_reason:reason});
  if(u.error)return alert(errMsg(u.error));
  dataCacheAt=0;dashboardCache=null;alert('Salary payment deleted/voided and the Cash Book was reversed.');staffProfile(r.data.staff_id);
}

async function invoiceClassSummary(){
  const yearId=document.getElementById('billYear')?.value||'';
  const termId=document.getElementById('billTerm')?.value||'';
  let q=db.from('fee_invoice_summary').select('id,student_enrollment_id,academic_year_id,term_id,total_billed,total_paid,outstanding,status');
  if(yearId)q=q.eq('academic_year_id',yearId);
  if(termId)q=q.eq('term_id',termId);
  const r=await q;
  if(r.error)return `<div class="notice err">${esc(errMsg(r.error))}</div>`;
  const groups={};
  (r.data||[]).forEach(i=>{
    const en=enrollments.find(e=>e.id===i.student_enrollment_id);
    const c=classes.find(c=>c.id===en?.class_id);
    const key=c?.id||'none';
    if(!groups[key])groups[key]={name:c?.name||'Unassigned Class',students:new Set(),invoices:0,billed:0,paid:0,outstanding:0};
    const g=groups[key];
    if(en?.student_id)g.students.add(en.student_id);
    g.invoices++;
    g.billed+=Number(i.total_billed||0);
    g.paid+=Number(i.total_paid||0);
    g.outstanding+=Number(i.outstanding||0);
  });
  const rows=Object.values(groups).sort((a,b)=>a.name.localeCompare(b.name));
  const total=rows.reduce((a,g)=>({students:a.students+g.students.size,invoices:a.invoices+g.invoices,billed:a.billed+g.billed,paid:a.paid+g.paid,outstanding:a.outstanding+g.outstanding}),{students:0,invoices:0,billed:0,paid:0,outstanding:0});
  return `<div class="table-wrap"><table><tr><th>Class</th><th>Students Billed</th><th>Invoices</th><th>Total Billed</th><th>Total Paid</th><th>Outstanding</th></tr>${rows.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.students.size}</td><td>${g.invoices}</td><td>${money(g.billed)}</td><td>${money(g.paid)}</td><td>${money(g.outstanding)}</td></tr>`).join('')||'<tr><td colspan="6">No invoices found for the selected academic year/term.</td></tr>'}<tr><th>Grand Total</th><th>${total.students}</th><th>${total.invoices}</th><th>${money(total.billed)}</th><th>${money(total.paid)}</th><th>${money(total.outstanding)}</th></tr></table></div>`;
}

async function showStudentBalance(){
  const sid=document.getElementById('payStudent')?.value||'';
  const box=document.getElementById('balanceBox');
  const invoiceSelect=document.getElementById('payInvoice');
  if(!sid){
    if(box)box.innerHTML='Select a student to see current balance.';
    if(invoiceSelect)invoiceSelect.innerHTML='<option value="">Optional invoice</option>';
    return;
  }
  const e=enrollments.find(x=>x.student_id===sid&&x.status==='active');
  if(!e){
    if(box)box.innerHTML='<span class="notice err">No active enrollment found for this student.</span>';
    if(invoiceSelect)invoiceSelect.innerHTML='<option value="">Optional invoice</option>';
    return;
  }
  const r=await db.from('student_fee_balances').select('*').eq('enrollment_id',e.id).maybeSingle();
  if(r.error){
    if(box)box.innerHTML=`<span class="notice err">${esc(errMsg(r.error))}</span>`;
    return;
  }
  const b=r.data||{};
  const expected=Number(b.total_expected||0);
  const paid=Number(b.total_paid||0);
  const outstanding=Math.max(Number(b.balance||0),0);
  if(box){
    box.innerHTML=`<b>Student Balance</b> · Current expected: <b>${money(expected)}</b> · Paid: <b>${money(paid)}</b> · Outstanding: <b>${money(outstanding)}</b>`;
  }
  if(invoiceSelect){
    const inv=await db.from('fee_invoice_summary').select('*').eq('student_enrollment_id',e.id).order('invoice_date',{ascending:false});
    if(inv.error){
      invoiceSelect.innerHTML='<option value="">Optional invoice</option>';
    }else{
      invoiceSelect.innerHTML='<option value="">Optional invoice</option>'+
        (inv.data||[]).map(i=>`<option value="${i.id}">${esc(i.invoice_no||'Invoice')} · Outstanding: ${money(i.outstanding||0)}</option>`).join('');
    }
  }
}

  const catEl=document.getElementById('expCat'), staffEl=document.getElementById('expStaff'),

        voucherEl=document.getElementById('expVoucher'), amtEl=document.getElementById('expAmt'),
        methodEl=document.getElementById('expMethod'), descEl=document.getElementById('expDesc');
  if(!catEl?.value||!amtEl?.value)return alert('Category and amount required.');
  const cat=expenseCats.find(c=>c.id===catEl.value);
  const catName=String(cat?.name||'').toLowerCase();
  const isSalary=catName.includes('salary');
  const isLoan=catName.includes('loan repayment');
  if(isSalary){
    if(!staffEl?.value)return alert('Please select the staff member being paid.');
    const s=staffRows.find(x=>x.id===staffEl.value);
    if(!s)return alert('Selected staff member was not found.');
    const amount=Number(amtEl.value);
    if(amount<=0)return alert('Salary amount must be greater than zero.');
    const r=await db.from('salary_payments').insert({
      staff_id:s.id,
      payment_date:dateEl.value,
      amount,
      payment_method:methodEl.value,
      reference_no:voucherEl.value||null,
      authorized_by:currentUser.id
    }).select().single();
    if(r.error)return alert(errMsg(r.error));
    const ref=r.data.voucher_no||'SAL-'+r.data.id.slice(0,8).toUpperCase();
    const msg=`Dear ${s.full_name}, salary payment of ${money(amount)} has been recorded on ${dateEl.value}. Voucher: ${ref}.`;
    await db.from('notification_messages').insert({
      recipient_type:'staff',
      recipient_name:s.full_name,
      recipient_phone:s.phone,
      staff_id:s.id,
      notification_type:'salary_payment',
      subject:'Salary payment',
      message:msg,
      related_salary_payment_id:r.data.id
    });
    const sms=await sendSchoolSMS(s.phone,msg);
    dataCacheAt=0; dashboardCache=null;
    alert(sms.ok?`Salary payment saved. Voucher ${ref}. SMS sent.`:`Salary payment saved. Voucher ${ref}. SMS queued; ${sms.message||'SMS service needs configuration.'}`);
    staffProfile(s.id);
    return;
  }
  if(isLoan&&loanEl?.value){
    const loan=await db.from('loans').select('id,outstanding_balance,loan_ref').eq('id',loanEl.value).single();
    if(loan.error)return alert(errMsg(loan.error));
    if(+amtEl.value>Number(loan.data.outstanding_balance||0))return alert('Repayment cannot exceed the current loan balance.');
    const r=await db.from('loan_repayments').insert({
      loan_id:loanEl.value,
      repayment_ref:voucherEl.value||'LR-'+Date.now(),
      repayment_date:dateEl.value,
      amount:+amtEl.value,
      payment_method:methodEl.value,
      is_reversed:false
    });
    if(r.error)return alert(errMsg(r.error));
    alert('Loan repayment saved and loan balance updated.');
    dataCacheAt=0; dashboardCache=null; expendituresPage(); return;
  }
  const r=await db.from('expenditures').insert({
    category_id:catEl.value,
    expenditure_date:dateEl.value,
    description:descEl.value,
    voucher_no:voucherEl.value||'VCH-'+Date.now(),
    amount:+amtEl.value,
    payment_method:methodEl.value,
    is_reversed:false
  });
  if(r.error)alert(errMsg(r.error));
  else{dataCacheAt=0;dashboardCache=null;expendituresPage();}
}

donly placeholder="Total Budget (UGX)"><div id="budTotal" class="notice">Total = Quantity × Unit Cost</div></div><div class="actions"><button id="budSaveBtn" class="primary" onclick="saveBudget()">Save Budget Item</button><button id="budCancelBtn" style="display:none" onclick="cancelBudgetEdit()">Cancel Edit</button><button onclick="printBudgetReport(window.currentBudgetItems||[],window.currentBudgetSummary||{})">Print Budget</button></div><h3>Budgeted Deductions</h3><div class="table-wrap"><table><tr><th>Item</th><th>Category</th><th>Year</th><th>Period</th><th>Qty</th><th>Unit Cost</th><th>Total</th><th class="no-print">Action</th></tr>${items.map(x=>{const total=Number(x.amount||0)||Number(x.quantity||0)*Number(x.unit_cost||0);return `<tr><td>${esc(x.item_name||x.expenditure_categories?.name||'Budget Item')}</td><td>${esc(x.expenditure_categories?.name||'')}</td><td>${years.find(y=>y.id===x.academic_year_id)?.year||''}</td><td>${esc(x.budget_period||'')}</td><td>${x.quantity||1}</td><td>${money(x.unit_cost||0)}</td><td>${money(total)}</td><td class="no-print"><button onclick="editBudgetItem('${x.id}')">Edit</button>${profile?.role==='director'?` <button class="danger" onclick="deleteBudgetItem('${x.id}')">Delete</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8">No budget items entered.</td></tr>'}</table></div></div>`;

async function paymentRegisterReport(){const r=await db.from('fee_payments').select('*,fee_items(name)').order('payment_date',{ascending:true});if(r.error)return alert(errMsg(r.error));const rows=(r.data||[]).map(p=>{const e=enrollments.find(e=>e.id===p.student_enrollment_id),s=students.find(s=>s.id===e?.student_id),c=classes.find(c=>c.id===e?.class_id);return `<tr><td>${p.payment_date||''}</td><td>${esc(p.receipt_no||'')}</td><td>${esc(s?.full_name||'')}</td><td>${esc(c?.name||'')}</td><td>${esc(p.fee_items?.name||'')}</td><td>${esc(p.payment_method||'')}</td><td>${money(p.amount||0)}</td><td>${p.is_reversed?'Reversed':'Posted'}</td></tr>`}).join('');renderPrintReport('STUDENT PAYMENT REGISTER',`<div class="table-wrap"><table><tr><th>Date</th><th>Receipt</th><th>Student</th><th>Class</th><th>Fee</th><th>Method</th><th>Amount</th><th>Status</th></tr>${rows||'<tr><td colspan="8">No payments found.</td></tr>'}</table></div>`)}
async function cashBookReportFromReports(){await cashPage();setTimeout(()=>printCashBookReport(),100)}
async function incomeReportFromReports(){const r=await db.from('cash_book_entries').select('*').eq('is_reversed',false).order('entry_date',{ascending:true});if(r.error)return alert(errMsg(r.error));let inc=0,ex=0;const rows=(r.data||[]).map(x=>{if(x.entry_type==='debit')inc+=Number(x.amount||0);else ex+=Number(x.amount||0);return `<tr><td>${x.entry_date||''}</td><td>${esc(x.description||'')}</td><td>${esc(x.reference_no||'')}</td><td>${x.entry_type==='debit'?money(x.amount):''}</td><td>${x.entry_type!=='debit'?money(x.amount):''}</td></tr>`}).join('');renderPrintReport('INCOME STATEMENT',`<div class="grid"><div class="card"><b>Income</b><div class="num">${money(inc)}</div></div><div class="card"><b>Expenses</b><div class="num">${money(ex)}</div></div><div class="card"><b>Surplus / (Deficit)</b><div class="num">${money(inc-ex)}</div></div></div><div class="table-wrap"><table><tr><th>Date</th><th>Details</th><th>Reference</th><th>Income</th><th>Expense</th></tr>${rows}</table></div>`)}
async function expenditureReport(){const r=await db.from('expenditures').select('*').order('expenditure_date',{ascending:true});if(r.error)return alert(errMsg(r.error));const rows=(r.data||[]).map(x=>`<tr><td>${x.expenditure_date||''}</td><td>${esc(x.description||x.item_name||'')}</td><td>${esc(x.category||'')}</td><td>${money(x.amount||0)}</td></tr>`).join('');renderPrintReport('EXPENDITURE REGISTER',`<div class="table-wrap"><table><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr>${rows||'<tr><td colspan="4">No expenditure records found.</td></tr>'}</table></div>`)}
async function staffSalaryReport(){const rows=staffRows.map(s=>`<tr><td>${esc(s.full_name||'')}</td><td>${money(Number(s.salary_amount||0)+Number(s.allowances||0))}</td><td>${money(s.outstanding_salary||0)}</td><td>${s.active===false?'Inactive':'Active'}</td></tr>`).join('');renderPrintReport('STAFF SALARY / UNPAID SALARY',`<div class="table-wrap"><table><tr><th>Staff</th><th>Salary + Allowances</th><th>Outstanding Salary</th><th>Status</th></tr>${rows||'<tr><td colspan="4">No staff records found.</td></tr>'}</table></div>`)}
async function loanRegisterReport(){const r=await db.from('loans').select('*').order('created_at',{ascending:true});if(r.error)return alert(errMsg(r.error));const rows=(r.data||[]).map(x=>`<tr><td>${esc(x.loan_no||x.id||'')}</td><td>${esc(x.borrower_name||x.member_name||'')}</td><td>${money(x.original_amount||x.amount||0)}</td><td>${money(x.amount_repaid||0)}</td><td>${money(x.outstanding_balance||0)}</td><td>${esc(x.status||'')}</td></tr>`).join('');renderPrintReport('LOAN REGISTER',`<div class="table-wrap"><table><tr><th>Loan</th><th>Borrower</th><th>Principal</th><th>Repaid</th><th>Outstanding</th><th>Status</th></tr>${rows||'<tr><td colspan="6">No loan records found.</td></tr>'}</table></div>`)}
async function sendSchoolSMS(number,message){if(!number)return {ok:false,message:'No phone number on record.'};try{const r=await db.functions.invoke('send-school-sms',{body:{number,message}});if(r.error)return {ok:false,message:r.error.message};const d=r.data||{};return {ok:d.ok===true,message:d.message||''}}catch(e){return {ok:false,message:e.message||'SMS service unavailable.'}}}
async function communicationsPage(){content.innerHTML=`<div class="panel"><h2>Parent & Staff Communications</h2><div class="notice">Fee payments and fee invoices queue a parent message automatically. Salary payments queue a staff/teacher message automatically. SMS delivery is integrated through EgoSMS; API credentials and a sender ID must be configured in the Supabase Edge Function before live SMS can leave the system. <a href="https://comms.egosms.co/messages" target="_blank" rel="noopener">Open EgoSMS Messages</a>. Use this page for general communication to all parents, a class, an individual parent, or individual staff.</div><div class="form"><select id="commAudience"><option value="all_parents">All Parents</option><option value="class_parents">Parents by Class</option><option value="individual_parent">Individual Parent</option><option value="individual_staff">Individual Staff</option></select><select id="commClass"><option value="">Select class</option>${classOpts()}</select><select id="commStudent"><option value="">Select student</option>${students.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select><select id="commStaff"><option value="">Select staff</option>${staffRows.map(s=>`<option value="${s.id}">${esc(s.full_name)}</option>`).join('')}</select><input id="commSubject" placeholder="Subject"><textarea id="commText" class="full" placeholder="Message to parents / staff"></textarea></div><div class="actions"><button class="primary" onclick="queueCommunication()">Queue Message(s)</button></div><div id="commMsg"></div><h3>Recent Message Queue</h3><div class="table-wrap"><table><tr><th>Date</th><th>Recipient</th><th>Phone</th><th>Type</th><th>Status</th><th>Message</th></tr>${await notificationRows()}</table></div></div>`}
async function queueCommunication(){const msg=commText.value.trim();if(!msg)return alert('Message required.');let rec=[];if(commAudience.value==='all_parents')rec=students;else if(commAudience.value==='class_parents'){const ids=enrollments.filter(e=>e.class_id===commClass.value&&e.status==='active').map(e=>e.student_id);rec=students.filter(s=>ids.includes(s.id))}else if(commAudience.value==='individual_parent'){const s=students.find(s=>s.id===commStudent.value);if(s)rec=[s]}else{const s=staffRows.find(s=>s.id===commStaff.value);if(s)rec=[s]}if(!rec.length)return alert('No recipients selected.');const rows=rec.map(x=>({recipient_type:commAudience.value.includes('staff')?'staff':'parent',recipient_name:x.full_name||x.parent_guardian,recipient_phone:x.phone||x.parent_phone,student_id:x.id&&x.parent_phone?x.id:null,staff_id:x.id&&x.phone?x.id:null,notification_type:'general_communication',subject:commSubject.value,message:msg,status:'queued',scheduled_at:new Date().toISOString()}));const r=await db.from('notification_messages').insert(rows);if(r.error)return commMsg.innerHTML=`<div class="notice err">${esc(errMsg(r.error))}</div>`;alert(`${rows.length} message(s) queued. SMS provider connection is required for actual delivery.`);communicationsPage()}
async function notificationRows(){const r=await db.from('notification_messages').select('*').order('created_at',{ascending:false}).limit(50);return (r.data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.recipient_name)}</td><td>${esc(x.recipient_phone)}</td><td>${esc(x.notification_type)}</td><td>${esc(x.status)}</td><td>${esc(x.message)}</td></tr>`).join('')}
async function settingsPage(){content.innerHTML=`<div class="panel"><h2>Settings</h2><div class="form"><input id="schoolName" value="${esc(settings.school_name||'Blessed Junior School – Ssambwe')}" placeholder="School name"><input id="schoolYear" type="number" value="${settings.current_academic_year||2026}" placeholder="Current academic year"><input id="schoolTerm" value="${esc(settings.current_term||'')}" placeholder="Current term"><input id="primaryColor" type="color" value="${settings.primary_color||'#F58220'}"><input id="secondaryColor" type="color" value="${settings.secondary_color||'#000080'}"></div><h3>School Branding</h3><div class="form"><div><label>School Logo</label><input id="logoFile" type="file" accept="image/*"><div id="logoPrev">${settings.logo_url?`<img class="logo-preview" src="${esc(settings.logo_url)}">`:''}</div></div><div><label>Dashboard Group Photo</label><input id="groupFile" type="file" accept="image/*"><div id="groupPrev">${settings.group_photo_url?`<img class="photo-preview" src="${esc(settings.group_photo_url)}">`:''}</div></div></div><div class="actions"><button class="primary" onclick="saveSettings()">Save Settings & Branding</button></div><div id="setMsg"></div><h3>Academic Years & Terms</h3><div class="form"><input id="newYear" type="number" placeholder="Academic year"><input id="newStart" type="date"><input id="newEnd" type="date"><input id="newTerm" placeholder="Term name"><input id="termStart" type="date"><input id="termEnd" type="date"></div><div class="actions"><button onclick="saveAcademicYear()">Add Academic Year</button><button onclick="saveTerm()">Add Term</button></div><h3>Current Access</h3><p>${esc(profile?.full_name||currentUser.email)} · <span class="pill">${esc(profile?.role||'director')}</span></p></div>`}
async function uploadImage(file,path){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const p=`school/${path}-${Date.now()}.${ext}`;const r=await db.storage.from('school-branding').upload(p,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return db.storage.from('school-branding').getPublicUrl(p).data.publicUrl}
async function saveSettings(){try{let logo=settings.logo_url,group=settings.group_photo_url;if(logoFile.files[0])logo=await uploadImage(logoFile.files[0],'logo');if(groupFile.files[0])group=await uploadImage(groupFile.files[0],'group-photo');const r=await db.from('school_settings').update({school_name:schoolName.value.trim(),current_academic_year:+schoolYear.value,current_term:schoolTerm.value.trim()||null,primary_color:primaryColor.value,secondary_color:secondaryColor.value,logo_url:logo,group_photo_url:group,updated_at:new Date().toISOString()}).eq('id',settings.id);if(r.error)throw r.error;await loadData();renderShell();settingsPage();setMsg.innerHTML='<div class="notice ok">Settings and branding saved.</div>'}catch(e){setMsg.innerHTML=`<div class="notice err">${esc(errMsg(e))}</div>`}}
async function saveAcademicYear(){if(!newYear.value)return;const r=await db.from('academic_years').insert({year:+newYear.value,start_date:newStart.value||null,end_date:newEnd.value||null,is_current:false});if(r.error)alert(errMsg(r.error));else{await loadData();settingsPage()}}
async function saveTerm(){const ay=years.find(y=>y.is_current)||years[0];if(!ay||!newTerm.value)return;const r=await db.from('terms').insert({academic_year_id:ay.id,name:newTerm.value,start_date:termStart.value||null,end_date:termEnd.value||null});if(r.error)alert(errMsg(r.error));else{await loadData();settingsPage()}}
function previewPhoto(input,target){const file=input?.files?.[0],box=document.getElementById(target);if(!box)return;if(!file){box.innerHTML='';return}const url=URL.createObjectURL(file);box.innerHTML=`<img src="${url}" alt="Photo preview">`}document.addEventListener('change',e=>{if(e.target.id==='sphotoFile')previewPhoto(e.target,'sphotoPreview');if(e.target.id==='stphotoFile')previewPhoto(e.target,'stphotoPreview')});async function logout(){await db.auth.signOut()}
init();
</script><div style="display:none">Enhanced Blessed Junior School foundation: student/staff photo upload, full registration editing, fee/expenditure item creation, parent/staff notifications, general communications, and dashboard event gallery.</div><script>/* PWA install icon fallback: the school crest is used for browser/home-screen branding. */</script></body></html>
