async function currentAcademicTerm(){
  // Use the database current flag first, then the school setting, then the newest year.
  // This keeps billing/fee-structure screens working even if a current flag was not set.
  const configuredYear=Number(settings?.current_academic_year||0);
  const ay=years.find(y=>y.is_current) || years.find(y=>Number(y.year)===configuredYear) || years[0];
  if(!ay)return {ay:null,term:null};
  const now=today();
  const yearTerms=terms.filter(t=>t.academic_year_id===ay.id);
  const configuredTerm=String(settings?.current_term||'').trim().toLowerCase();
  const term=yearTerms.find(t=>configuredTerm && String(t.name||'').trim().toLowerCase()===configuredTerm)
    || yearTerms.find(t=>(!t.start_date||t.start_date<=now)&&(!t.end_date||t.end_date>=now))
    || yearTerms[0] || terms.find(t=>(!t.start_date||t.start_date<=now)&&(!t.end_date||t.end_date>=now));
  return {ay,term};
}

async function tuitionAmountForStudent(studentId,yearId,termId){
  const s=students.find(x=>x.id===studentId); const en=enrollments.find(e=>e.student_id===studentId&&e.status==='active');
  if(!s||!en||!yearId||!termId)return 0;
  const r=await db.from('fee_structures').select('day_fee,boarding_fee').eq('class_id',en.class_id).eq('academic_year_id',yearId).eq('term_id',termId).maybeSingle();

async function autoInvoiceAllTuition(){
  const {ay,term}=await currentAcademicTerm(); const tuitionId=await getTuitionFeeId();
  if(!ay||!term||!tuitionId)return alert('Current academic year/term or Tuition Fees item is missing.');
  const st=students.filter(s=>s.status==='active'); let created=0,skipped=0;
  for(const s of st){
    const en=enrollments.find(e=>e.student_id===s.id&&e.academic_year_id===ay.id&&e.status==='active'); if(!en){skipped++;continue;}
    const amount=await tuitionAmountForStudent(s.id,ay.id,term.id); if(amount<=0){skipped++;continue;}
    const existing=await db.from('fee_invoices').select('id').eq('student_enrollment_id',en.id).eq('academic_year_id',ay.id).eq('term_id',term.id).neq('status','cancelled');
    const ids=existing.data||[]; let already=false;
    if(ids.length){const li=await db.from('fee_invoice_items').select('invoice_id').eq('fee_item_id',tuitionId).in('invoice_id',ids.map(x=>x.id));already=(li.data||[]).length>0;}
    if(already){skipped++;continue;}
    let inv=await db.from('fee_invoices').insert({student_enrollment_id:en.id,academic_year_id:ay.id,term_id:term.id,invoice_date:today(),status:'draft',notes:'Automatic current-term tuition fee'}).select().single();
    if(inv.error)return alert(errMsg(inv.error));
    let li=await db.from('fee_invoice_items').insert({invoice_id:inv.data.id,fee_item_id:tuitionId,amount,description:`${s.student_type||'Day'} tuition - ${classes.find(c=>c.id===en.class_id)?.name||''}`});
    if(li.error){await db.from('fee_invoices').delete().eq('id',inv.data.id);return alert(errMsg(li.error));}
    const up=await db.from('fee_invoices').update({status:'issued'}).eq('id',inv.data.id); if(up.error)return alert(errMsg(up.error)); created++;
  }
  alert(`Tuition invoicing complete: ${created} invoice(s) created, ${skipped} skipped.`); billingPage();
}

async function saveSalaryFromProfile(defaultStaffId){

async function invoiceClassSummary(){
  const yearId=document.getElementById('billYear')?.value||'';
  const termId=document.getElementById('billTerm')?.value||'';
  let q=db.from('fee_invoice_summary').select('id,student_enrollment_id,academic_year_id,term_id,total_billed,total_paid,outstanding,status');
  if(yearId)q=q.eq('academic_year_id',yearId);
  if(termId)q=q.eq('term_id',termId);
  const r=await q;
  if(r.error)return `<div class="notice err">${esc(errMsg(r.error))}</div>`;
  const groups={};
  (r.data||[]).forEach(i=>{
    const en=enrollments.find(e=>e.id===i.student_enrollment_id);
    const c=classes.find(c=>c.id===en?.class_id);
    const key=c?.id||'none';
    if(!groups[key])groups[key]={name:c?.name||'Unassigned Class',students:new Set(),invoices:0,billed:0,paid:0,outstanding:0};
    const g=groups[key];
    if(en?.student_id)g.students.add(en.student_id);
    g.invoices++;
    g.billed+=Number(i.total_billed||0);
    g.paid+=Number(i.total_paid||0);
    g.outstanding+=Number(i.outstanding||0);
  });
  const rows=Object.values(groups).sort((a,b)=>a.name.localeCompare(b.name));
  const total=rows.reduce((a,g)=>({students:a.students+g.students.size,invoices:a.invoices+g.invoices,billed:a.billed+g.billed,paid:a.paid+g.paid,outstanding:a.outstanding+g.outstanding}),{students:0,invoices:0,billed:0,paid:0,outstanding:0});
  return `<div class="table-wrap"><table><tr><th>Class</th><th>Students Billed</th><th>Invoices</th><th>Total Billed</th><th>Total Paid</th><th>Outstanding</th></tr>${rows.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${g.students.size}</td><td>${g.invoices}</td><td>${money(g.billed)}</td><td>${money(g.paid)}</td><td>${money(g.outstanding)}</td></tr>`).join('')||'<tr><td colspan="6">No invoices found for the selected academic year/term.</td></tr>'}<tr><th>Grand Total</th><th>${total.students}</th><th>${total.invoices}</th><th>${money(total.billed)}</th><th>${money(total.paid)}</th><th>${money(total.outstanding)}</th></tr></table></div>`;
}

    const cats=expenseCats||[]; const catName=cats.find(c=>c.id===z.category_id)?.name||''; const catText=prompt(`Category name (current: ${catName}) — leave unchanged to keep it:`,catName); if(catText===null)return;
    let catId=z.category_id; const match=cats.find(c=>c.name.toLowerCase()===catText.trim().toLowerCase()); if(match)catId=match.id;
    const u=await db.rpc('edit_expenditure_transaction',{p_id:sourceId,p_expenditure_date:date,p_amount:+amount,p_description:desc,p_reference_no:ref,p_category_id:catId}); if(u.error)return alert(errMsg(u.error)); dataCacheAt=0;dashboardCache=null;alert('Expenditure corrected and the Cash Book was synchronized.');return cashPage();
  }
  if(!sourceType){const date=prompt('Entry date (YYYY-MM-DD):',x.entry_date);if(!date)return;const amount=prompt('Amount (UGX):',x.amount);if(!amount||+amount<=0)return;const description=prompt('Description:',x.description||'');if(description===null)return;const reference=prompt('Reference:',x.reference_no||'');if(reference===null)return;const category=prompt('Category:',x.category||'');if(category===null)return;const type=prompt('Entry type: debit = money received, credit = money spent',x.entry_type);if(!['debit','credit'].includes(type))return alert('Entry type must be debit or credit.');const u=await db.rpc('edit_manual_cash_book_entry',{p_id:id,p_entry_date:date,p_amount:+amount,p_description:description,p_reference_no:reference,p_category:category});if(u.error)return alert(errMsg(u.error));if(type!==x.entry_type){const q=await db.from('cash_book_entries').update({entry_type:type}).eq('id',id);if(q.error)return alert(errMsg(q.error));}dataCacheAt=0;dashboardCache=null;alert('Cash-book transaction updated.');return cashPage();}
  return alert('This linked cash-book entry should be corrected from its source module. For salary and expenditure entries, the Edit button above now opens the correction directly. For other linked entries, use Reverse to preserve the accounting trail.');
}

async function reverseCashTransaction(id,sourceType,sourceId){const reason=prompt('Reason for reversal:');if(!reason)return;if(sourceType&&sourceId){const map={fee_payment:'fee_payments',expenditure:'expenditures',loan_repayment:'loan_repayments',salary_payment:'salary_payments'};const table=map[sourceType];if(!table)return alert('This linked transaction type is not supported for automatic reversal.');const r=await db.rpc('reverse_financial_transaction',{p_table:table,p_id:sourceId,p_reason:reason});if(r.error)return alert(errMsg(r.error));}else{const r=await db.rpc('reverse_financial_transaction',{p_table:'cash_book_entries',p_id:id,p_reason:reason});if(r.error)return alert(errMsg(r.error));}alert('Transaction reversed and audit record created.');dataCacheAt=0;dashboardCache=null;cashPage()}
async function hardDeleteCashTransaction(id,sourceType){if(profile?.role!=='director')return alert('Only the Director can permanently delete Cash Book transactions.');const r0=await db.from('cash_book_entries').select('id,entry_date,entry_type,amount,description,reference_no,source_type,is_reversed').eq('id',id).single();if(r0.error)return alert(errMsg(r0.error));const x=r0.data;const direction=x.entry_type==='debit'?'RECEIPT / MONEY RECEIVED':'PAYMENT / MONEY SPENT';const status=x.is_reversed?'ALREADY REVERSED':'POSTED';const ok=confirm(`PERMANENT HARD DELETE\n\nDate: ${x.entry_date||''}\nType: ${direction}\nAmount: ${money(x.amount)}\nReference: ${x.reference_no||'—'}\nDetails: ${x.description||'—'}\nStatus: ${status}\n\nThis will permanently remove the Cash Book transaction${sourceType?' AND its linked source transaction':''}.\nThis is intended for duplicate/error cleanup and cannot be undone.\n\nContinue?`);if(!ok)return;const reason=prompt('Enter the reason for permanent deletion (for example: Duplicate payment caused by network delay):');if(!reason?.trim())return alert('A deletion reason is required.');const r=await db.rpc('hard_delete_cashbook_transaction',{p_id:id,p_source_type:sourceType||null,p_reason:reason.trim()});if(r.error)return alert(errMsg(r.error));alert('Transaction permanently deleted and the accounting records were synchronized.');dataCacheAt=0;dashboardCache=null;cashPage()}

y reduces the loan balance. It is not double-posted as a separate expenditure.</div><div class="actions"><button class="primary" onclick="saveExpense()">Save Expenditure / Payment</button>${profile?.role==='director'?`<button class="secondary" onclick="createExpenseCategory()">+ Create Expenditure Item</button>`:''}</div><div class="table-wrap"><table><tr><th>Date</th><th>Voucher/Ref</th><th>Category</th><th>Description</th><th>Amount</th><th>Status</th><th class="no-print">Actions</th></tr>${await expenditureRows()}</table></div></div>`}
function fillSalaryAmountFromStaff(){
  const staffEl=document.getElementById('expStaff');
  const amtEl=document.getElementById('expAmt');
  const s=staffRows.find(x=>x.id===staffEl?.value);
  if(s&&amtEl&&!amtEl.value){amtEl.value=(Number(s.salary_amount||0)+Number(s.allowances||0)).toFixed(2);}
  const desc=document.getElementById('expDesc');
  if(s&&desc)desc.value=`Salary payment - ${s.full_name}`;
}

function toggleSalaryExpense(){
  const cat=document.getElementById('expCat');
  const staff=document.getElementById('expStaff');
  const note=document.getElementById('salaryExpenseNote');
  const selected=cat?.selectedOptions?.[0];
  const show=String(selected?.textContent||'').toLowerCase().includes('salary');
  if(staff)staff.style.display=show?'block':'none';
  if(note)note.style.display=show?'block':'none';
  if(show){
    const desc=document.getElementById('expDesc');
    if(desc && !desc.value)desc.value='Staff salary payment';
    const loan=document.getElementById('expLoan');
    if(loan){loan.style.display='none';loan.value='';}
  }else if(staff){
    staff.value='';
  }
}
function toggleLoanExpense(){
  const cat=document.getElementById('expCat');
  const loan=document.getElementById('expLoan');
  const note=document.getElementById('loanExpenseNote');
  const item=expenseCats.find(c=>c.id===cat?.value);
  const show=String(item?.name||'').toLowerCase().includes('loan repayment');
  if(loan)loan.style.display=show?'block':'none';
  if(note)note.style.display=show?'block':'none';
  if(show){
    const desc=document.getElementById('expDesc');
    if(desc && !desc.value)desc.value='Loan repayment';
    const staff=document.getElementById('expStaff');
    if(staff){staff.style.display='none';staff.value='';}
  }
}
function toggleExpensePaymentType(){
  const cat=document.getElementById('expCat');
  const staff=document.getElementById('expStaff');
  const loan=document.getElementById('expLoan');
  const salaryNote=document.getElementById('salaryExpenseNote');
  const loanNote=document.getElementById('loanExpenseNote');
  const item=expenseCats.find(c=>c.id===cat?.value);
  const name=String(item?.name||'').toLowerCase();
  const isSalary=name.includes('salary');
  const isLoan=name.includes('loan repayment');
  if(isSalary){
    toggleSalaryExpense();
  }else{
    if(staff){staff.style.display='none';staff.value='';}
    if(salaryNote)salaryNote.style.display='none';
  }
  if(isLoan){
    toggleLoanExpense();
  }else{
    if(loan){loan.style.display='none';loan.value='';}
    if(loanNote)loanNote.style.display='none';
  }
}
async function saveExpense(){
  const catEl=document.getElementById('expCat'), staffEl=document.getElementById('expStaff'),
        loanEl=document.getElementById('expLoan'), dateEl=document.getElementById('expDate'),
        voucherEl=document.getElementById('expVoucher'), amtEl=document.getElementById('expAmt'),
        methodEl=document.getElementById('expMethod'), descEl=document.getElementById('expDesc');
  if(!catEl?.value||!amtEl?.value)return alert('Category and amount required.');
  const cat=expenseCats.find(c=>c.id===catEl.value);
  const catName=String(cat?.name||'').toLowerCase();
  const isSalary=catName.includes('salary');
  const isLoan=catName.includes('loan repayment');
  if(isSalary){
    if(!staffEl?.value)return alert('Please select the staff member being paid.');
    const s=staffRows.find(x=>x.id===staffEl.value);
    if(!s)return alert('Selected staff member was not found.');
    const amount=Number(amtEl.value);
    if(amount<=0)return alert('Salary amount must be greater than zero.');
    const r=await db.from('salary_payments').insert({
      staff_id:s.id,
      payment_date:dateEl.value,
      amount,
      payment_method:methodEl.value,
      reference_no:voucherEl.value||null,
      authorized_by:currentUser.id
    }).select().single();
    if(r.error)return alert(errMsg(r.error));
    const ref=r.data.voucher_no||'SAL-'+r.data.id.slice(0,8).toUpperCase();
    const msg=`Dear ${s.full_name}, salary payment of ${money(amount)} has been recorded on ${dateEl.value}. Voucher: ${ref}.`;
    await db.from('notification_messages').insert({
      recipient_type:'staff',
      recipient_name:s.full_name,
      recipient_phone:s.phone,
      staff_id:s.id,
      notification_type:'salary_payment',
      subject:'Salary payment',
      message:msg,
      related_salary_payment_id:r.data.id
    });
    const sms=await sendSchoolSMS(s.phone,msg);
    dataCacheAt=0; dashboardCache=null;
    alert(sms.ok?`Salary payment saved. Voucher ${ref}. SMS sent.`:`Salary payment saved. Voucher ${ref}. SMS queued; ${sms.message||'SMS service needs configuration.'}`);
    staffProfile(s.id);
    return;
  }
  if(isLoan&&loanEl?.value){
    const loan=await db.from('loans').select('id,outstanding_balance,loan_ref').eq('id',loanEl.value).single();
    if(loan.error)return alert(errMsg(loan.error));
    if(+amtEl.value>Number(loan.data.outstanding_balance||0))return alert('Repayment cannot exceed the current loan balance.');
    const r=await db.from('loan_repayments').insert({
      loan_id:loanEl.value,
      repayment_ref:voucherEl.value||'LR-'+Date.now(),
      repayment_date:dateEl.value,
      amount:+amtEl.value,
      payment_method:methodEl.value,
      is_reversed:false
    });
    if(r.error)return alert(errMsg(r.error));
    alert('Loan repayment saved and loan balance updated.');
    dataCacheAt=0; dashboardCache=null; expendituresPage(); return;
  }
  const r=await db.from('expenditures').insert({
    category_id:catEl.value,
    expenditure_date:dateEl.value,
    description:descEl.value,
    voucher_no:voucherEl.value||'VCH-'+Date.now(),
    amount:+amtEl.value,
    payment_method:methodEl.value,
    is_reversed:false
  });
  if(r.error)alert(errMsg(r.error));
  else{dataCacheAt=0;dashboardCache=null;expendituresPage();}
}

async function loanLedger(id){

  }).join('');

    <div class="grid ledger-summary">
      <div class="card"><div class="label">Original Principal Recorded</div><div class="num">${money(loan.original_amount)}</div></div>
      <div class="card"><div class="label">Repayments Posted (not reversed)</div><div class="num">${money(totalRepaid)}</div></div>
      <div class="card"><div class="label">Outstanding Balance (system record)</div><div class="num">${money(effectiveBalance)}</div></div>
    </div>
    <h3>Loan Details</h3>
    <div class="table-wrap"><table class="ledger-details">
      <tr><th>Loan Reference</th><td>${esc(loan.loan_ref||'—')}</td><th>Loan Provider / Lender</th><td>${esc(loan.lender||'—')}</td></tr>
      <tr><th>Loan Date</th><td>${esc(loan.loan_date||'—')}</td><th>Status</th><td>${esc(loan.status||'—')}</td></tr>
      <tr><th>Purpose</th><td>${esc(loan.purpose||'—')}</td><th>Repayment Terms</th><td>${esc(loan.repayment_terms||'—')}</td></tr>
    </table></div>
    <h3>Repayment History</h3>
    <p class="small">Running balance is calculated from the recorded original amount less posted repayments in date order. Reversed repayments are shown for audit but are not deducted.</p>
    <div class="table-wrap"><table class="continuous-account-table">
      <thead><tr><th>Repayment Date</th><th>Receipt / Reference</th><th>Payment Method</th><th class="amount">Amount Paid (UGX)</th><th class="amount">Running Balance (UGX)</th><th>Status</th></tr></thead>
      <tbody>${history||'<tr><td colspan="6">No repayment records have been found for this loan.</td></tr>'}</tbody>
      <tfoot><tr class="total"><th colspan="3">Total Posted Repayments</th><th class="amount">${money(totalRepaid)}</th><th class="amount">${money(Math.max(0,Number(loan.original_amount||0)-totalRepaid))}</th><th>Balance after posted repayments</th></tr></tfoot>
    </table></div>
    <h3>Provider Reconciliation</h3>
    <p>Use this section when comparing the school ledger with the lender's statement. Enter the lender's figure on the printout and record the reason for any difference.</p>

      <tr><th>Balance according to school system (UGX)</th><td>${money(effectiveBalance)}</td><th>Difference to investigate (UGX)</th><td>________________________________</td></tr>
      <tr><th>Reconciliation notes / action required</th><td colspan="3" style="height:65px">________________________________________________________________________________</td></tr>

async function getFinancialStatementData(){
  await loadData(true);
  const ay=years.find(y=>y.is_current)||years.find(y=>Number(y.year)===Number(settings?.current_academic_year||0))||years[0];
  const ayId=ay?.id||'00000000-0000-0000-0000-000000000000';
  const [inv,cb,exp]=await Promise.all([
    db.from('fee_invoice_summary').select('total_billed,total_paid,outstanding,status,academic_year_id').eq('academic_year_id',ayId).neq('status','cancelled'),
    db.from('cash_book_entries').select('*').eq('is_reversed',false).order('entry_date',{ascending:true}),
    db.from('expenditures').select('*,expenditure_categories(name)').eq('is_reversed',false).order('expenditure_date',{ascending:true})
  ]);
  if(inv.error)return {error:inv.error};
  if(cb.error)return {error:cb.error};
  if(exp.error)return {error:exp.error};

  // Outstanding is defined directly from the money expected and money actually paid by students.
  // We deliberately do NOT trust a pre-calculated outstanding field here, so the statement
  // always follows: Outstanding = Money Expected - Money Paid So Far.
  const grossSales=(inv.data||[]).reduce((a,x)=>a+Number(x.total_billed||0),0);

  // NET SALES must reflect the money actually received from students so far.
  // Do not depend on the invoice-summary view's total_paid value, because a
  // stale/empty summary must not make NET SALES show zero when payments exist.
  const feePay=await db.from('fee_payments').select('amount,is_reversed').eq('is_reversed',false);
  if(feePay.error)return {error:feePay.error};
  const totalPaid=(feePay.data||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const outstanding=Math.max(grossSales-totalPaid,0);
  const netSales=Math.max(grossSales-outstanding,0);

  const activeStaff=staffRows.filter(s=>s.active!==false);
  const termPayroll=activeStaff.reduce((a,s)=>a+(Number(s.salary_amount||0)+Number(s.allowances||0))*3,0);
  const previousSalaryOutstanding=activeStaff.reduce((a,s)=>a+Number(s.outstanding_salary||0),0);
  const costOfSales=termPayroll+previousSalaryOutstanding;
  const grossProfit=netSales-costOfSales;

  const credits=(cb.data||[]).filter(x=>x.entry_type==='credit');
  const expMap=Object.fromEntries((exp.data||[]).map(x=>[x.id,x]));
  const loanIds=credits.filter(x=>x.source_type==='loan_repayment'&&x.source_id).map(x=>x.source_id);
  const salIds=credits.filter(x=>x.source_type==='salary_payment'&&x.source_id).map(x=>x.source_id);
  const [loanR,salR]=await Promise.all([
    loanIds.length?db.from('loan_repayments').select('id,loan_id,loans(loan_ref,lender)').in('id',loanIds):Promise.resolve({data:[]}),
    salIds.length?db.from('salary_payments').select('id,staff_id,staff(full_name,staff_id)').in('id',salIds):Promise.resolve({data:[]})
  ]);
  if(loanR.error)return {error:loanR.error};
  if(salR.error)return {error:salR.error};
  const loanMap=Object.fromEntries((loanR.data||[]).map(x=>[x.id,x]));
  const salMap=Object.fromEntries((salR.data||[]).map(x=>[x.id,x]));

  const expenditureRows=credits.map(x=>{
    const linked=x.source_type==='expenditure'&&x.source_id?expMap[x.source_id]:null;
    const loan= x.source_type==='loan_repayment'&&x.source_id ? loanMap[x.source_id]?.loans : null;
    const salary=x.source_type==='salary_payment'&&x.source_id ? salMap[x.source_id]?.staff : null;
    let category=linked?.expenditure_categories?.name||x.category||'';
    let description=linked?.description||x.description||'';
    if(x.source_type==='salary_payment'){category='Staff Salaries';description=salary?.full_name?`Salary — ${salary.full_name}`:'Staff Salary Payment';}
    if(x.source_type==='loan_repayment'){category='Loan Repayments';description=loan?.loan_ref?`Loan ${loan.loan_ref}${loan.lender?' — '+loan.lender:''}`:(loan?.lender?`Loan Repayment — ${loan.lender}`:'Loan Repayment');}
    return {id:x.id,source_type:x.source_type||'',source_id:x.source_id||'',expenditure_date:x.entry_date,category,description,voucher_no:linked?.voucher_no||x.reference_no||'',amount:Number(x.amount||0),salary,loan};
  });

  const grouped={};
  expenditureRows.forEach(x=>{
    let key=x.source_type==='salary_payment'?'Staff Salaries':x.source_type==='loan_repayment'?'Loan Repayments':(x.category||x.description||'Other Expenses').trim();
    if(!grouped[key])grouped[key]={key,item:key,amount:0,rows:[]};
    grouped[key].amount+=x.amount; grouped[key].rows.push(x);
  });
  const expenseGroups=Object.values(grouped).sort((a,b)=>b.amount-a.amount);
  const totalExpenditure=expenditureRows.reduce((a,x)=>a+Number(x.amount||0),0);
  const netProfitLoss=grossProfit-totalExpenditure;

  const salaryDetail=expenditureRows.filter(x=>x.source_type==='salary_payment');
  const loanDetail=expenditureRows.filter(x=>x.source_type==='loan_repayment');
  const costOfSalesStaff=activeStaff.map(s=>({name:s.full_name||'Staff Member',staff_id:s.staff_id||'',monthly:Number(s.salary_amount||0)+Number(s.allowances||0),threeMonths:(Number(s.salary_amount||0)+Number(s.allowances||0))*3,outstanding:Number(s.outstanding_salary||0),total:(Number(s.salary_amount||0)+Number(s.allowances||0))*3+Number(s.outstanding_salary||0)}));
  return {grossSales,totalPaid,outstanding,netSales,termPayroll,previousSalaryOutstanding,costOfSales,grossProfit,expenditureRows,expenseGroups,totalExpenditure,netProfitLoss,salaryDetail,loanDetail,costOfSalesStaff,academicYear:ay?.year||settings?.current_academic_year||''};
}
function financialStatementHtml(d,printMode=false){
  const detailRows=(rows,kind)=>rows.map(x=>{
    const who=kind==='salary'?(x.salary?.full_name||x.description||'Staff Salary'):(x.loan?.loan_ref?`${x.loan.loan_ref}${x.loan.lender?' — '+x.loan.lender:''}`:(x.description||'Loan Repayment'));
    const extra=kind==='salary'?(x.salary?.staff_id?`Staff ID: ${x.salary.staff_id}`:''):(x.loan?.lender?`Lender: ${x.loan.lender}`:'');
    return `<tr><td>${esc(x.expenditure_date||'')}</td><td>${esc(who)}</td><td>${esc(extra)}</td><td>${esc(x.voucher_no||'')}</td><td class="amount">${money(x.amount||0)}</td></tr>`;
  }).join('');
  const expenseItemLines=(rows)=>rows.map(x=>`<div class="expense-detail-line"><span>${esc(x.description||x.category||'Expense')}</span><b>${money(x.amount||0)}</b></div>`).join('');
  // Consolidate similar expense categories into one line. The middle column
  // contains the consolidated amount for that category; the final column is

  const statementExpenseRows=(d.expenseGroups||[]).map(g=>`<tr class="expense-item-row"><td>${esc(g.item||'Expense')}</td><td class="amount expense-item-amount">${money(g.amount||0)}</td><td class="amount"></td></tr>`).join('');
  const salaryCostDetail=(d.costOfSalesStaff||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.staff_id||'')}</td><td class="amount">${money(x.monthly)}</td><td class="amount">${money(x.threeMonths)}</td><td class="amount">${money(x.outstanding)}</td><td class="amount">${money(x.total)}</td></tr>`).join('');
  const continuousRows=`
    <tr class="section-row"><th colspan="3">TRADING ACCOUNT</th></tr>
    <tr><td>Gross Sales — Total Money Expected</td><td></td><td class="amount"><b>${money(d.grossSales)}</b></td></tr>

    <tr class="expandable-row" onclick="toggleFinancialDetail('costOfSalesDetail')"><td><span class="expand-icon" id="icon_costOfSalesDetail">▶</span> Less: Cost of Sales <span class="small muted">(click to expand staff salaries)</span></td><td></td><td class="amount">${money(d.costOfSales)}</td></tr>
    <tr id="costOfSalesDetail" class="financial-detail" style="display:none"><td colspan="3"><div class="detail-box"><table class="detail-table"><thead><tr><th>Staff / Recipient</th><th>Staff ID</th><th class="amount">Monthly Salary + Allowances</th><th class="amount">3-Month Salary</th><th class="amount">Outstanding Salary</th><th class="amount">Cost of Sales</th></tr></thead><tbody>${salaryCostDetail||'<tr><td colspan="6">No active staff records found.</td></tr>'}</tbody><tfoot><tr><th colspan="5">Cost of Sales Total</th><th class="amount">${money(d.costOfSales)}</th></tr></tfoot></table></div></td></tr>
    <tr class="key-total"><th>GROSS PROFIT</th><td></td><th class="amount">${money(d.grossProfit)}</th></tr>
    <tr class="section-row"><th colspan="3">PROFIT AND LOSS ACCOUNT</th></tr>
    <tr><td>Gross Profit brought down</td><td></td><td class="amount"><b>${money(d.grossProfit)}</b></td></tr>
    ${statementExpenseRows||'<tr><td>No expenditure items recorded</td><td class="amount">0</td><td class="amount"></td></tr>'}
    <tr class="total"><th>TOTAL EXPENSES</th><td></td><th class="amount">${money(d.totalExpenditure)}</th></tr>
    <tr class="grand-total"><th>NET PROFIT / (LOSS)</th><td></td><th class="amount">${money(d.netProfitLoss)}</th></tr>`;
  return `<div class="financial-statement">
    <div class="statement-banner"><b>FINANCIAL STATEMENT — ACADEMIC YEAR ${esc(d.academicYear)}</b><span>Trading Account and Profit &amp; Loss Account presented as one continuous statement</span></div>
    <div class="account-summary"><div><span>Gross Sales / Total Money Expected</span><strong>${money(d.grossSales)}</strong></div><div><span>Money Paid So Far by Students</span><strong>${money(d.totalPaid)}</strong></div><div class="key-summary"><span>NET SALES</span><strong>${money(d.netSales)}</strong></div></div>
    <div class="account-table-wrap"><table class="account-table continuous-account-table"><thead><tr><th>PARTICULARS</th><th>AMOUNT</th><th class="amount">FINAL AMOUNT (UGX)</th></tr></thead><tbody>${continuousRows}</tbody></table></div>
    <div class="statement-note"><b>Presentation:</b> Trading Account and Profit &amp; Loss Account are attached together in one continuous table. Each expenditure item is listed separately under Particulars, its individual amount is recorded in the middle Amount column, and the final column is reserved for summary figures such as TOTAL EXPENSES and NET PROFIT / (LOSS). Underlying transaction records are not merged or changed.</div>
    <h3 class="detail-heading">EXPENDITURE SUPPORTING SCHEDULE</h3><div class="table-wrap"><table class="statement-detail-table"><thead><tr><th>Date</th><th>Category / Item</th><th>Description</th><th>Voucher / Reference</th><th class="amount">Amount (UGX)</th></tr></thead><tbody>${(d.expenditureRows||[]).map(x=>`<tr><td>${esc(x.expenditure_date||'')}</td><td>${esc(x.category||'')}</td><td>${esc(x.description||'')}</td><td>${esc(x.voucher_no||'')}</td><td class="amount">${money(x.amount||0)}</td></tr>`).join('')||'<tr><td colspan="5">No posted expenditure items found.</td></tr>'}</tbody><tfoot><tr><th colspan="4">TOTAL EXPENDITURE</th><th class="amount">${money(d.totalExpenditure)}</th></tr></tfoot></table></div>

    <div class="actions no-print"><button class="primary" onclick="printFinancialStatement()">🖨️ Print / Save as PDF</button></div>

async function previewAcademicCsv(){const file=document.getElementById('academicCsv')?.files?.[0];if(!file)return alert('Choose a CSV file first.');const text=await file.text();const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)return alert('The CSV file has no result rows.');const detectDelimiter=line=>{let best=',',score=-1;for(const d of [',',';','\t']){let n=0,q=false;for(let i=0;i<line.length;i++){if(line[i]==='"')q=!q;else if(line[i]===d&&!q)n++}if(n>score){score=n;best=d}}return best};const delimiter=detectDelimiter(lines[0]);const parseLine=line=>{const out=[];let v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===delimiter&&!q){out.push(v.trim());v=''}else v+=c}out.push(v.trim());return out};const norm=x=>x.toLowerCase().replace(/\ufeff/g,'').trim().replace(/[\s-]+/g,'_').replace(/[^a-z0-9_]/g,'');const headers=parseLine(lines[0]).map(norm);const alias={admission_no:['admission_no','admission_number','admission','student_no','student_number','adm_no','registration_no'],student_name:['student_name','name','full_name','pupil_name'],subject:['subject','subjects'],marks:['marks','mark','score','obtained_marks','marks_obtained','eot'],max_marks:['max_marks','maximum_marks','out_of','max','total_marks'],comment:['comment','comments','teacher_comment','remarks','subject_comment'],initials:['initials','teacher_initials','teacher']};const findCol=key=>headers.findIndex(h=>alias[key].includes(h));const col={};Object.keys(alias).forEach(k=>col[k]=findCol(k));const required=['admission_no','subject','marks'];const missing=required.filter(x=>col[x]<0);if(missing.length)return alert('Could not identify required CSV column(s): '+missing.join(', ')+'. Use the latest class template with admission_no, student_name, subject, marks, max_marks, comment, initials.');const rows=lines.slice(1).map(line=>{const vals=parseLine(line),o={};Object.keys(col).forE function printDocumentWithoutPopup(doc,title){
 const frame=document.createElement('iframe');
 frame.setAttribute('title',title||'Print preview');
 frame.setAttribute('aria-hidden','true');
 frame.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;z-index:-1;background:#fff';
 document.body.appendChild(frame);
 let cleaned=false;
 const cleanup=()=>{if(cleaned)return;cleaned=true;setTimeout(()=>{try{frame.remove()}catch(e){}},500)};
 try{
   const w=frame.contentWindow,d=frame.contentDocument||w.document;
   d.open();d.write(doc);d.close();
   const doPrint=async()=>{
     try{
       const imgs=Array.from(d.images||[]);
       await Promise.race([
         Promise.all(imgs.map(async img=>{
           if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})});
           if(img.complete&&img.naturalWidth>0&&typeof img.decode==='function'){try{await img.decode()}catch(e){}}
         })),
         new Promise(resolve=>setTimeout(resolve,8000))
       ]);
       try{w.focus();w.print()}catch(e){alert('Your browser could not open the print dialog. Please use Ctrl+P while the report is displayed.')}
     }finally{
       try{w.addEventListener('afterprint',cleanup,{once:true})}catch(e){}
       setTimeout(cleanup,60000);
     }
   };
   if(d.readyState==='complete')setTimeout(doPrint,250);
   else frame.addEventListener('load',()=>setTimeout(doPrint,250),{once:true});
 }catch(e){
   cleanup();
   alert('The report could not be prepared for printing. Please try again or use Ctrl+P.');
 }
}

><p class="small">Choose the completed year and the new year. Preview the class movements first. The system retains old-year enrolment and results, skips learners already enrolled in the destination year, and only processes promotion after confirmation.</p><div class="form"><label>From Academic Year<select id="promotionFromYear">${years.map(a=>`<option value="${a.id}">${esc(a.year)}</option>`).join('')}</select></label><label>To Academic Year<select id="promotionToYear">${years.map(a=>`<option value="${a.id}">${esc(a.year)}</option>`).join('')}</select></label></div><div class="actions"><button class="primary" onclick="previewLearnerPromotion()">Preview Learners & Classes</button></div><div id="promotionPreview"></div>`:''}<h3>Current Access</h3><p>${esc(profile?.full_name||currentUser.email)} · <span class="pill">${esc(profile?.role||'director')}</span></p></div>`}

let pendingLearnerPromotion=null;
async function previewLearnerPromotion(){
 if(!isAcademicDirector())return alert('Only the Director can promote learners.');
 const from=document.getElementById('promotionFromYear')?.value,to=document.getElementById('promotionToYear')?.value,box=document.getElementById('promotionPreview');
 if(!from||!to||from===to)return alert('Choose two different academic years.');if(box)box.innerHTML='<p>Loading learners…</p>';
 try{
  const [src,dst]=await Promise.all([db.from('student_enrollments').select('id,student_id,academic_year_id,class_id,status,opening_balance').eq('academic_year_id',from).eq('status','active'),db.from('student_enrollments').select('student_id,class_id,status').eq('academic_year_id',to)]);
  if(src.error)throw src.error;if(dst.error)throw dst.error;
  const existing=new Set((dst.data||[]).map(x=>x.student_id));
  const roster=(src.data||[]).filter(x=>students.some(st=>st.id===x.student_id));
  if(!roster.length){if(box)box.innerHTML='<div class="notice">No active learner enrolments were found for the selected source year.</div>';pendingLearnerPromotion=null;return}
  const groups=[...new Set(roster.map(x=>x.class_id))].map(cid=>({cid,rows:roster.filter(x=>x.class_id===cid)}));
  const opts=classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  pendingLearnerPromotion={from,to,rows:roster,existing};
  if(box)box.innerHTML=`<div class="notice">${roster.length} active enrolments found. ${existing.size} learner(s) already have an enrolment in the destination year and will be skipped.</div><div class="table-wrap"><table><tr><th>Current Class</th><th>Learners</th><th>Promote To</th></tr>${groups.map(g=>{const c=classes.find(x=>x.id===g.cid);const next=classes.find(x=>Number(x.sort_order)>Number(c?.sort_order))||null;return `<tr><td>${esc(c?.name||'Unassigned')}</td><td>${g.rows.length}</td><td><select class="promotion-target" data-source-class="${g.cid}"><option value="__complete__">Complete / Do not enrol</option>${opts}</select><small class="small">Suggested next: ${esc(next?.name||'Select a destination')}</small></td></tr>`}).join('')}</table></div><p class="small">Review each class destination. Learners marked “Complete / Do not enrol” will not receive a new enrolment. Existing source-year records and academic results are retained.</p><div class="actions"><button class="primary" onclick="confirmLearnerPromotion()">Confirm & Process Promotion</button></div>`;
  groups.forEach(g=>{const c=classes.find(x=>x.id===g.cid),next=classes.find(x=>Number(x.sort_order)>Number(c?.sort_order));const sel=box?.querySelector(`.promotion-target[data-source-class="${g.cid}"]`);if(sel&&next)sel.value=next.id});
 }catch(e){pendingLearnerPromotion=null;if(box)box.innerHTML=`<div class="notice err">Could not prepare promotion preview: ${esc(errMsg(e))}</div>`}
}
async function confirmLearnerPromotion(){
 if(!isAcademicDirector()||!pendingLearnerPromotion)return alert('Prepare a promotion preview first.');
 const p=pendingLearnerPromotion,box=document.getElementById('promotionPreview');if(!confirm('Confirm promotion from the selected completed year to the new academic year? This will create new enrolments and retain the old-year records.'))return;
 const targets={};document.querySelectorAll('.promotion-target').forEach(x=>targets[x.dataset.sourceClass]=x.value);
 let made=0,skipped=0,completed=0,failed=[];
 for(const old of p.rows){
  if(p.existing.has(old.student_id)){skipped++;continue}
  const target=targets[old.class_id];if(!target||target==='__complete__'){const u=await db.from('student_enrollments').update({status:'inactive'}).eq('id',old.id);if(u.error)failed.push(students.find(s=>s.id===old.student_id)?.full_name+': '+errMsg(u.error));else completed++;continue}
  const u=await db.from('student_enrollments').update({status:'inactive'}).eq('id',old.id);if(u.error){failed.push(students.find(s=>s.id===old.student_id)?.full_name+': '+errMsg(u.error));continue}
  const ins=await db.from('student_enrollments').insert({student_id:old.student_id,academic_year_id:p.to,class_id:target,status:'active',opening_balance:0});
  if(ins.error){const back=await db.from('student_enrollments').update({status:'active'}).eq('id',old.id);failed.push(students.find(s=>s.id===old.student_id)?.full_name+': '+errMsg(ins.error)+(back.error?' (also could not restore the previous enrolment: '+errMsg(back.error)+')':''));continue}made++;
 }
 pendingLearnerPromotion=null;await loadData(true);if(box)box.innerHTML=`<div class="notice ${failed.length?'err':'ok'}"><b>Promotion processing finished.</b><br>New enrolments: ${made}<br>Marked completed (no new class): ${completed}<br>Already enrolled and skipped: ${skipped}<br>Errors: ${failed.length}${failed.length?`<ul>${failed.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`;
}

// Enhanced report-card automation: comments, fee balance, branding, QR verification and batch printing.
function academicGradePoint(mark,max){
  const grade=academicGrade(mark,max);
  const points=Number(String(grade).slice(1));
  return Number.isFinite(points)&&points>=1&&points<=9?points:0;
}
function academicDivision(aggregate){
  const a=Number(aggregate);
  if(!Number.isFinite(a)||a<4)return '—';
  if(a<=12)return 'Division 1';
  if(a<=24)return 'Division 2';
  if(a<=29)return 'Division 3';
  if(a<=32)return 'Division 4';
  return 'U';
}
function academicPromotionDecision(aggregate,termName,className){
  const termNo=academicTermNumber(termName);
  if(termNo!==3)return 'Promotion decision is made in Term 3 only';
  const cls=String(className||'').trim();
  const match=cls.match(/^(?:P|PRIMARY\s*)([1-7])\b/i);
  if(!match)return 'Not applicable to this class';
  const level=Number(match[1]),a=Number(aggregate);
  if(!Number.isFinite(a)||a<4)return 'Pending results';
  const division=academicDivision(a);
  if(division==='U')return `Advised to repeat P${level}`;
  if(division==='Division 4')return level===7?'Graduated to OBs and OGs on probation':'Promoted to P'+(level+1)+' on probation';
  if(division==='Division 1'||division==='Division 2'||division==='Division 3')return level===7?'Graduated to OBs and OGs':`Promoted to P${level+1}`;
  return 'Pending results';
}
function automaticTeacherComment(avg){return avg>=85?'An outstanding performance. Keep up the excellent effort.':avg>=75?'Very good progress. Continue working hard to achieve even better results.':avg>=60?'Good effort. More consistent revision will improve your performance.':avg>=50?'Fair performance. Regular practice and guidance are encouraged.':'Needs additional support and consistent practice to improve.'}
function automaticDosComment(avg){return avg>=80?'The learner has demonstrated strong academic commitment. Maintain this standard.':avg>=60?'Satisfactory progress. Focus on areas that need improvement next term.':'A structured improvement plan and close academic support are recommended.'}
function automaticHeadComment(avg){return avg>=80?'Congratulations. Continue striving for excellence.':avg>=60?'Keep working hard. We look forward to better performance next term.':'We encourage the learner and family to work closely with the school to improve results.'}
function earlyYearsDivision(className,average){
 const n=String(className||'').toLowerCase();
 if(!/(^|\b)(baby|middle|top)(\b|$)/.test(n))return '';
 const band=Number(average)>=80?'A':Number(average)>=60?'B':'C';
 const theme=band==='A'?'#15803d':band==='B'?'#2563eb':'#ea580c';
 return `<div class="early-division" style="--division:${theme}"><div class="early-division-icon">🏆</div><div><small>MY OVERALL DIVISION</small><strong>${band}</strong><span>A: 80–100% &nbsp; B: 60–79.99% &nbsp; C: Below 60%</span></div><div class="early-stars">⭐ 🌈 ⭐</div></div>`;
}
async function buildAcademicReportCard(sid,y,t){
 const st=students.find(x=>x.id===sid),enr=await db.from('student_enrollments').select('id,student_id,academic_year_id,class_id,status,opening_balance').eq('student_id',sid).eq('academic_year_id',y).limit(1);if(enr.error)throw enr.error;const en=(enr.data||[])[0]||null,cl=classes.find(x=>x.id===(en?.class_id||'')),yr=years.find(x=>x.id===y),tr=terms.find(x=>x.id===t);
 const r=await db.from('academic_results').select('*').eq('student_id',sid).eq('academic_year_id',y).eq('term_id',t).order('subject');if(r.error)throw r.error;const rows=r.data||[];if(!rows.length)return null;
 const all=await db.from('academic_results').select('student_id,subject,marks,max_marks,class_id,stream').eq('academic_year_id',y).eq('term_id',t).eq('class_id',cl?.id||'');if(all.error)throw all.error;
 const isEarlyClass=/baby|middle|top/i.test(String(cl?.name||''));
 const isPrimaryClass=/^(?:P[1-7]|PRIMARY\s*[1-7])\b/i.test(String(cl?.name||'').trim());
 const totals={};(all.data||[]).forEach(x=>{totals[x.student_id]??={aggregate:0,marks:0,max:0};totals[x.student_id].marks+=Number(x.marks||0);totals[x.student_id].max+=Number(x.max_marks||100);if(!isEarlyClass&&!isPrimaryClass){totals[x.student_id].aggregate+=academicGradePoint(x.marks,x.max_marks)}});
 // Primary 1–7 positions are based strictly on each learner's total marks, highest first.
 // Early-years percentage ranking and the existing non-primary aggregate ranking remain unchanged.
 const rank=Object.entries(totals).filter(x=>isEarlyClass||isPrimaryClass?x[1].max>0:x[1].aggregate>0).sort((a,b)=>isEarlyClass?(b[1].marks/b[1].max)-(a[1].marks/a[1].max):isPrimaryClass?b[1].marks-a[1].marks:a[1].aggregate-b[1].aggregate);
 const aggregate=isEarlyClass?0:rows.reduce((sum,x)=>sum+academicGradePoint(x.marks,x.max_marks),0);
 const ownAverage=rows.reduce((sum,x)=>sum+Number(x.marks||0),0)/(rows.reduce((sum,x)=>sum+Number(x.max_marks||100),0)||1);
 const total=rows.reduce((a,x)=>a+Number(x.marks||0),0),max=rows.reduce((a,x)=>a+Number(x.max_marks||100),0),avg=max?total*100/max:0;
 // Equal total marks share the same position; the next position follows competition ranking (1, 1, 3).
 const pos=isPrimaryClass?(rank.filter(x=>x[1].marks>total).length+1):isEarlyClass?rank.filter(x=>x[1].marks/x[1].max>ownAverage).length+1:aggregate>0?rank.filter(x=>x[1].aggregate<aggregate).length+1:0;
 const classEnrolment=students.filter(s=>studentClassId(s.id)===cl?.id).length;
 let balanceValue=null;
 if(en){
   const b=await db.from('student_fee_balances').select('balance').eq('enrollment_id',en.id).maybeSingle();
   if(!b.error&&b.data&&b.data.balance!==null&&b.data.balance!==undefined)balanceValue=Number(b.data.balance)||0;
   // If the balance view has no row, derive the current outstanding amount from issued invoice summaries.
   if(balanceValue===null){
     const inv=await db.from('fee_invoice_summary').select('outstanding,status').eq('student_enrollment_id',en.id);
     if(!inv.error&&Array.isArray(inv.data)){
       balanceValue=inv.data.filter(x=>String(x.status||'').toLowerCase()!=='cancelled').reduce((sum,x)=>sum+Number(x.outstanding||0),0);
     }
   }
 }
 const balance=balanceValue===null?'Not available':money(Math.max(0,balanceValue));
 const termAnchor=String(tr?.end_date||tr?.start_date||'');
 const nextTerm=terms.filter(x=>x.start_date&&termAnchor&&String(x.start_date)>termAnchor).sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date)))[0];
 const nextTermBegins=nextTerm?.start_date||'Not set';
 const name=esc(st?.full_name||''),details={school:settings.school_name||'Blessed Junior School – Ssambwe',student:st?.full_name||'',admission_no:st?.admission_no||'',class:cl?.name||'',term:tr?.name||'',year:yr?.year||'',total,average:avg.toFixed(2)+'%',position:pos+'/'+rank.length,fees_balance:balance,subjects:rows.map(x=>({subject:x.subject,marks:x.marks,grade:academicGrade(x.marks,x.max_marks)}))};
 const qr='https://api.qrserver.com/v1/create-qr-code/?size=130x130&data='+encodeURIComponent(JSON.stringify(details));
 const logo=`<img src="${esc(settings?.logo_url||DEFAULT_SCHOOL_LOGO)}" alt="Blessed Junior School logo" style="display:block;width:82px;height:82px;object-fit:contain" onerror="this.style.display='none'">`;
 const photo=st?.photo_url
   ?`<img src="${esc(st.photo_url)}" alt="Student photograph" style="display:block;width:88px;height:105px;object-fit:cover;border:1px solid #777">`
   :`<div style="width:88px;height:105px;border:1px solid #777;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#555">Student<br>Photo</div>`;
 return `<div class="academic-report ${isEarlyClass?'early-years-report':'primary-report'}">
   <div class="report-topline"><span>✦ BLESSED JUNIOR SCHOOL ✦</span><span>LEARN • GROW • SHINE</span></div>
   <div class="report-header">
    <div class="report-logo">${logo}</div>
    <div class="report-school-title"><h1>${esc(settings.school_name||'BLESSED JUNIOR SCHOOL – SSAMBWE')}</h1><div class="report-contact" style="font-size:8.5px;font-weight:700;line-height:1.35;color:#25345b">P.O.Box 29086, Kampala &nbsp; | &nbsp; Tel: 0776 433 999, 0772 150 007</div><div class="report-motto">GOD CARES</div><h2>END OF ${esc(String(tr?.name||'TERM').toUpperCase())} ${esc(yr?.year||'')} ACADEMIC REPORT</h2></div>
    <div class="report-photo">${photo}</div>
   </div>
   ${isEarlyClass?'<div class="kids-ribbon"><span>🌈</span><b>MY LEARNING ADVENTURE</b><span>🧸 ✏️ ⭐</span></div>':''}
   <div class="report-student-grid">
    <div class="student-detail student-name"><small>LEARNER'S NAME</small><strong>${name}</strong></div>
    <div class="student-detail"><small>ADMISSION NO.</small><strong>${esc(st?.admission_no||'—')}</strong></div>
    <div class="student-detail"><small>CLASS</small><strong>${esc(cl?.name||'—')}</strong></div>
    <div class="student-detail"><small>STREAM</small><strong>${esc(rows[0]?.stream||'—')}</strong></div>
    <div class="student-detail"><small>TERM / YEAR</small><strong>${esc(tr?.name||'')} ${esc(yr?.year||'')}</strong></div>
    <div class="student-detail"><small>NEXT TERM BEGINS ON</small><strong>${esc(nextTermBegins)}</strong></div>
   </div>
   <div class="performance-heading"><span>📚</span><div><b>ACADEMIC PERFORMANCE</b><small>Subjects, marks and teacher's remarks</small></div><span>✏️</span></div>
   <table class="report-marks-table"><thead><tr><th>SUBJECT</th><th>MARKS</th><th>GRADE</th><th>TEACHER'S COMMENT</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.marks}/${x.max_marks}</td><td><span class="grade-chip">${academicGrade(x.marks,x.max_marks)}</span></td><td>${esc(x.comment||'—')}</td></tr>`).join('')}<tr class="report-total-row"><th>TOTAL</th><th>${total}/${max}</th><th>AVERAGE ${avg.toFixed(2)}%</th><th>POSITION ${pos||'—'} / ${isPrimaryClass?rank.length:(classEnrolment||rank.length)}</th></tr></tbody></table>
   <div class="report-highlights">
    <div class="highlight-box position-box"><small>🏅 CLASS POSITION</small><strong>${pos||'—'} <em>/ ${isPrimaryClass?rank.length:(classEnrolment||rank.length)}</em></strong></div>
    ${isEarlyClass?earlyYearsDivision(cl?.name,avg):`<div class="highlight-box"><small>📊 AGGREGATE</small><strong>${aggregate}</strong></div>${isPrimaryClass?`<div class="highlight-box"><small>🏅 DIVISION</small><strong>${esc(academicDivision(aggregate))}</strong></div><div class="highlight-box"><small>🎓 PROMOTION / PLE</small><strong class="promotion-text">${esc(academicPromotionDecision(aggregate,tr?.name,cl?.name))}</strong></div>`:''}`}
    <div class="highlight-box fees-box"><small>💛 FEES BALANCE</small><strong>${balance}</strong></div>
   </div>
   <div class="teacher-comments">
    <div><b>Class Teacher's Comment</b><p>${automaticTeacherComment(avg)}</p></div>
    <div><b>Director of Studies' Comment</b><p>${automaticDosComment(avg)}</p></div>
    <div><b>Headteacher's Comment</b><p>${automaticHeadComment(avg)}</p></div>
   </div>
   ${isEarlyClass?'<div class="cartoon-footer"><span>🦁</span><span>🐻</span><span>🦋</span><span>🌟 Keep smiling and keep learning! 🌟</span><span>🐘</span><span>🐰</span></div>':''}
   <div class="report-footer"><small>${isEarlyClass?'Grading: A 80–100 · B 60–79.99 · C below 60':'Grading: D1 85–100 · D2 80–84 · C3 75–79 · C4 70–74 · C5 65–69 · C6 60–64 · P7 55–59 · P8 50–54 · F9 0–49'}</small><div class="report-qr"><img src="${qr}" width="65" height="65"><span>Report verification</span></div></div>
  </div>`;
}
async function generateAcademicReportCard(){const sid=document.getElementById('reportStudent')?.value,y=document.getElementById('acadYear')?.value,t=document.getElementById('acadTerm')?.value;if(!sid||!y||!t)return alert('Select a student, academic year and term.');try{const html=await buildAcademicReportCard(sid,y,t);if(!html)return alert('No academic results saved for this pupil in the selected term.');document.getElementById('academicReport').innerHTML=html;window.academicReportHtml=html}catch(e){alert('Could not prepare report card: '+errMsg(e))}}
async function printWholeClassReports(){const cid=document.getElementById('acadClass')?.value||document.getElementById('templateClass')?.value,y=document.getElementById('acadYear')?.value||document.getElementById('templateYear')?.value,t=document.getElementById('acadTerm')?.value||document.getElementById('templateTerm')?.value;if(!cid||!y||!t)return alert('Select class, academic year and term first.');const roster=students.filter(s=>studentClassId(s.id)===cid).sort((a,b)=>String(a.full_name||'').localeCompare(String(b.full_name||'')));if(!roster.length)return alert('No students found in this class.');let printWindow=null;try{printWindow=window.open('about:blank','_blank')}catch(e){}const reports=[];try{for(const st of roster){const h=await buildAcademicReportCard(st.id,y,t);if(h)reports.push(h)}if(!reports.length){if(printWindow)printWindow.close();return alert('No saved results were found for this class and term.')}openReportForPrint(reports.join(''),(classes.find(c=>c.id===cid)?.name||'Class')+'_Report_Cards',printWindow);}catch(e){if(printWindow)printWindow.close();alert('Class reports could not be prepared: '+errMsg(e))}}

init();
</script><div style="display:none">Enhanced Blessed Junior School foundation: student/staff photo upload, full registration editing, fee/expenditure item creation, parent/staff notifications, general communications, and dashboard event gallery.</div><script>/* PWA install icon fallback: the school crest is used for browser/home-screen branding. */</script></body></html>
